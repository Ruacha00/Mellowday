[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mellowday"
version = "0.1.0"
description = "A self-hosted personal daily assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "playwright>=1.46,<2.0",
    "pytest>=7.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mellowday.web_app" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["mellowday"]
strict = true
