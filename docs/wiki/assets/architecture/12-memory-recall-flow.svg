<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.purple{fill:#6045a9}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1120"/>
  <text class="title" x="720" y="90">Memory 召回流程</text>
  <rect class="panel shadow" x="80" y="150" width="1760" height="820" rx="24"/>

  <g transform="translate(150,260)"><rect class="card blueCard" width="260" height="130" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">用户请求</text><text class="small" x="42" y="88">当前 query</text></g>
  <g transform="translate(500,260)"><rect class="card greenCard" width="270" height="130" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">有效事实</text><text class="small" x="42" y="88">SQLite active records</text></g>
  <g transform="translate(870,260)"><rect class="card orangeCard" width="270" height="130" rx="18"/><circle class="orange" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">词项评分</text><text class="small" x="42" y="88">当前 query 匹配</text></g>
  <g transform="translate(1240,260)"><rect class="card purpleCard" width="270" height="130" rx="18"/><circle class="purple" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">预算控制</text><text class="small" x="42" y="88">选取记录与正文</text></g>
  <path class="line" d="M410 325H500"/>
  <path class="line" d="M770 325H870"/>
  <path class="line" d="M1140 325H1240"/>

  <g transform="translate(500,570)"><rect class="card greenCard" width="310" height="140" rx="18"/><text class="label" x="84" y="50">注入上下文</text><text class="small" x="44" y="88">system-reminder</text><text class="muted" x="44" y="116">旧事实变化显式告知</text></g>
  <g transform="translate(970,570)"><rect class="card blueCard" width="310" height="140" rx="18"/><text class="label" x="92" y="50">避免重复</text><text class="small" x="44" y="88">already_surfaced</text><text class="muted" x="44" y="116">控制 session 注入总量</text></g>
  <path class="gline" d="M1375 390C1375 505 655 500 655 570"/>
  <path class="line" d="M810 640H970"/>

  <rect class="card" x="260" y="810" width="1400" height="110" rx="18"/>
  <text class="section" x="830" y="856">边界</text>
  <text class="small" x="390" y="895">已保存事实召回与新记忆提取不同；新记忆仅评估当前原文一次，不回扫历史。</text>
</svg>
