<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
  <defs><style>.bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 24px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.shadow{filter:url(#shadow)}</style><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker></defs>
  <rect class="bg" width="1920" height="1280"/>
  <text class="title" x="680" y="90">数据与存储架构</text>
  <rect class="panel shadow" x="80" y="160" width="1760" height="900" rx="24"/>
  <g transform="translate(150,260)"><rect class="card blueCard" width="330" height="190" rx="20"/><text class="label" x="94" y="54">会话数据</text><text class="small" x="64" y="96">data/sessions</text><text class="muted" x="54" y="132">history / trace / state</text><text class="muted" x="72" y="162">选择会话恢复</text></g>
  <g transform="translate(570,260)"><rect class="card greenCard" width="330" height="190" rx="20"/><text class="label" x="94" y="54">长期记忆</text><text class="small" x="64" y="96">mellowday.sqlite3</text><text class="muted" x="56" y="132">active memories</text><text class="muted" x="68" y="162">当前轮授权写入</text></g>
  <g transform="translate(990,260)"><rect class="card purpleCard" width="330" height="190" rx="20"/><text class="label" x="94" y="54">活动 Skills</text><text class="small" x="54" y="96">data/skills</text><text class="muted" x="52" y="132">SKILL.md / references</text><text class="muted" x="72" y="162">候选描述检索</text></g>
  <g transform="translate(1410,260)"><rect class="card orangeCard" width="330" height="190" rx="20"/><text class="label" x="94" y="54">停用 Skills</text><text class="small" x="54" y="96">skills/.archive</text><text class="muted" x="76" y="132">保留可恢复目录</text><text class="muted" x="74" y="162">单一数据根目录</text></g>
  <g transform="translate(280,610)"><rect class="card greenCard" width="360" height="230" rx="20"/><text class="label" x="92" y="54">自进化审计</text><text class="small" x="48" y="96">skill_evolution/</text><text class="muted" x="48" y="134">usage.jsonl</text><text class="muted" x="48" y="166">online_provenance.jsonl</text><text class="muted" x="48" y="198">skill_usage_stats.json</text></g>
  <g transform="translate(780,610)"><rect class="card blueCard" width="360" height="230" rx="20"/><text class="label" x="110" y="54">配置文件</text><text class="small" x="88" y="96">.env / config.json</text><text class="muted" x="74" y="134">模型 API 配置</text><text class="muted" x="74" y="166">环境变量优先</text><text class="muted" x="74" y="198">自动沉淀开关</text></g>
  <g transform="translate(1280,610)"><rect class="card purpleCard" width="360" height="230" rx="20"/><text class="label" x="110" y="54">运行代码</text><text class="small" x="88" y="96">src/mellowday/</text><text class="muted" x="74" y="134">Agent Runtime</text><text class="muted" x="74" y="166">Tools / Memory</text><text class="muted" x="74" y="198">Skills Evolution</text></g>
  <path class="line" d="M480 355H570"/><path class="line" d="M900 355H990"/><path class="line" d="M1320 355H1410"/><path class="line" d="M315 450V610"/><path class="line" d="M1155 450V610"/>
