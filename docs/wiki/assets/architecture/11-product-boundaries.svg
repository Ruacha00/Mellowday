<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
  <defs>
    <style>
      .bg{fill:#fbfcfb}.panel{fill:#f7fcf9;stroke:#cfe3d7;stroke-width:1.6}.card{fill:#fff;stroke:#d7e1df;stroke-width:1.4}.greenCard{fill:#f7fcf9;stroke:#bfe2ce}.blueCard{fill:#f3f9ff;stroke:#cad9e9}.orangeCard{fill:#fff9ef;stroke:#efd7af}.purpleCard{fill:#f7f3ff;stroke:#d3c6ef}.title{font:800 42px "PingFang SC","Microsoft YaHei",Arial;fill:#13213b}.section{font:800 30px "PingFang SC","Microsoft YaHei",Arial;fill:#08733d}.label{font:800 23px "PingFang SC","Microsoft YaHei",Arial;fill:#17243d}.small{font:500 18px "PingFang SC","Microsoft YaHei",Arial;fill:#25324b}.muted{font:500 16px "PingFang SC","Microsoft YaHei",Arial;fill:#657284}.line{stroke:#aeb8c4;stroke-width:4;fill:none;marker-end:url(#arrow)}.gline{stroke:#14945b;stroke-width:4;fill:none;marker-end:url(#garrow)}.blue{fill:#3165b7}.green{fill:#14945b}.orange{fill:#f47d22}.purple{fill:#6045a9}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#d8e1df" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aeb8c4"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14945b"/></marker>
  </defs>
  <rect class="bg" width="1920" height="1180"/>
  <text class="title" x="650" y="90">MellowDay 产品能力边界</text>
  <rect class="panel shadow" x="80" y="150" width="1760" height="880" rx="24"/>

  <rect class="card orangeCard" x="140" y="230" width="390" height="230" rx="18"/>
  <text class="section" x="255" y="280">当前产品范围</text>
  <text class="small" x="180" y="326">单用户 / 单角色 / 聊天优先</text>
  <text class="small" x="180" y="364">禁用 MCP / Plan / 子 Agent</text>
  <text class="small" x="180" y="402">保留代码不表示产品开放</text>

  <g transform="translate(660,230)"><rect class="card blueCard" width="270" height="130" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">Web 构造</text><text class="small" x="42" y="88">product_mode=True</text></g>
  <g transform="translate(1040,230)"><rect class="card greenCard" width="270" height="130" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">连接阶段</text><text class="small" x="42" y="88">跳过 MCP 初始化</text></g>
  <g transform="translate(1420,230)"><rect class="card purpleCard" width="270" height="130" rx="18"/><circle class="purple" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">发布工具</text><text class="small" x="42" y="88">仅业务工具集合</text></g>
  <path class="line" d="M930 295H1040"/>
  <path class="line" d="M1310 295H1420"/>

  <g transform="translate(360,560)"><rect class="card greenCard" width="280" height="130" rx="18"/><circle class="green" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">执行入口</text><text class="small" x="42" y="88">未授予工具拒绝</text></g>
  <g transform="translate(820,560)"><rect class="card orangeCard" width="280" height="130" rx="18"/><circle class="orange" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">后台学习</text><text class="small" x="42" y="88">单独授权机制</text></g>
  <g transform="translate(1280,560)"><rect class="card blueCard" width="280" height="130" rx="18"/><circle class="blue" cx="42" cy="42" r="22"/><text class="label" x="78" y="50">开发协作</text><text class="small" x="42" y="88">不等于产品子代理</text></g>
  <path class="gline" d="M1555 360C1555 475 500 465 500 560"/>
  <path class="line" d="M640 625H820"/>
  <path class="line" d="M1100 625H1280"/>

  <rect class="card" x="260" y="820" width="1400" height="120" rx="18"/>
  <text class="section" x="790" y="870">边界核验</text>
  <text class="small" x="370" y="912">核验真实构造参数和执行入口，不能只看 UI 是否隐藏，不能只看底层是否保留模块。</text>
</svg>
